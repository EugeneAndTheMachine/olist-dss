version: 2

sources:
  - name: raw
    description: "Bronze queryable: 1 bảng / file nguồn, mọi cột text + _batch_id, _loaded_at, _source_file (load_raw.py)."
    schema: raw
    tables:
      - name: orders
        description: "olist_orders_dataset.csv"
      - name: order_items
        description: "olist_order_items_dataset.csv"
      - name: order_payments
        description: "olist_order_payments_dataset.csv"
      - name: order_reviews
        description: "olist_order_reviews_dataset.csv"
      - name: customers
        description: "olist_customers_dataset.csv"
      - name: sellers
        description: "olist_sellers_dataset.csv"
      - name: products
        description: "olist_products_dataset.csv (cột *_lenght sai chính tả gốc)"
      - name: geolocation
        description: "olist_geolocation_dataset.csv (~1M dòng, nhiều điểm / zip)"
      - name: product_category_name_translation
        description: "product_category_name_translation.csv"
      - name: mql
        description: "olist_marketing_qualified_leads_dataset.csv"
      - name: closed_deals
        description: "olist_closed_deals_dataset.csv"
      - name: ibge_states
        description: "IBGE /localidades/estados (JSON đã làm phẳng)"
      - name: ibge_municipalities
        description: "IBGE /localidades/municipios (JSON đã làm phẳng)"
      - name: br_holidays
        description: "Ngày lễ quốc gia Brazil 2016–2019 sinh từ package holidays"
      - name: br_states
        description: "File nhóm chuẩn bị: state_code, state_name, region_name"
      - name: calendar_events
        description: "File nhóm chuẩn bị: event_date, event_name, event_type (national_holiday / retail_event)"

  - name: ml
    description: "Output mô hình Python (DDL ở docker/postgres/init/03_ml.sql)."
    schema: ml
    tables:
      - name: order_late_risk
      - name: promise_whatif
      - name: customer_segment_history
      - name: voucher_allocation
      - name: gmv_forecast
      - name: seller_risk_score
      - name: channel_value
      - name: recommendations

  - name: meta
    description: "Metadata vận hành (DDL ở docker/postgres/init/02_meta.sql)."
    schema: meta
    tables:
      - name: etl_run_log
      - name: dq_results
      - name: data_dictionary
      - name: source_to_target
      - name: model_registry
      - name: decision_log
