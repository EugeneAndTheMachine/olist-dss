version: 2

sources:
  - name: raw
    description: "Bronze queryable: 1 bảng / file nguồn, mọi cột text + _batch_id, _loaded_at, _source_file (load_raw.py)."
    schema: raw
    tables:
      - name: orders
        description: "olist_orders_dataset.csv"
      - name: order_items
        description: "olist_order_items_dataset.csv"
      - name: order_payments
        description: "olist_order_payments_dataset.csv"
      - name: order_reviews
        description: "olist_order_reviews_dataset.csv"
      - name: customers
        description: "olist_customers_dataset.csv"
      - name: sellers
        description: "olist_sellers_dataset.csv"
      - name: products
        description: "olist_products_dataset.csv (cột *_lenght sai chính tả gốc)"
      - name: geolocation
        description: "olist_geolocation_dataset.csv (~1M dòng, nhiều điểm / zip)"
      - name: product_category_name_translation
        description: "product_category_name_translation.csv"

  - name: meta
    description: "Metadata vận hành (DDL ở docker/postgres/init/02_meta.sql)."
    schema: meta
    tables:
      - name: etl_run_log
      - name: dq_results
      - name: data_dictionary
      - name: source_to_target
      - name: model_registry
      - name: decision_log
