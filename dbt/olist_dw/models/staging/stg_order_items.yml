version: 2

models:
  - name: stg_order_items
    description: "1 dòng = 1 item (order_id, order_item_id), dedup giữa các batch raw (BR-CS2-1)."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [order_id, order_item_id]
    columns:
      - name: order_id
        description: "Mã đơn."
        data_tests: [not_null]
      - name: order_item_id
        description: "Số thứ tự item trong đơn (1, 2, …)."
        data_tests: [not_null]
      - name: product_id
        description: "Sản phẩm bán."
        data_tests: [not_null]
      - name: seller_id
        description: "Seller của item."
        data_tests: [not_null]
      - name: shipping_limit_at
        description: "Hạn seller giao item cho hãng vận chuyển. Null khi nằm ngoài phạm vi dim_date (BR-CS2-2)."
      - name: price
        description: "Giá item (BRL). Cơ sở tính GMV (BR-K1)."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: freight_value
        description: "Phí vận chuyển của item (BRL)."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: _dq_issue
        description: "Cờ chất lượng dữ liệu: 'shipping_limit_out_of_range' hoặc null. Không bỏ dòng (BR-S6)."
        data_tests:
          - accepted_values:
              values: ['shipping_limit_out_of_range']
      - name: _batch_id
        description: "Batch nạp raw của dòng."
      - name: _loaded_at
        description: "Thời điểm nạp batch raw."
