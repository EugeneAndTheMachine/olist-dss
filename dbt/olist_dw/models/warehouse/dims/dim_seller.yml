version: 2

models:
  - name: dim_seller
    description: >
      C-W4. 1 dòng = 1 phiên bản seller (SCD Type 2 trên seller_tier, BR-W10) + member -1. Khoảng hiệu lực đóng
      [valid_from, valid_to]; fact tra theo ngày mua (BR-CW4-0). Hiện tại mỗi seller 1 phiên bản 'Not scored';
      phiên bản theo tier thêm ở bước 2 mà không đổi contract.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [seller_id, valid_from]
    columns:
      - name: seller_key
        description: "Surrogate key int_sk(seller_id, valid_from); -1 = unknown."
        data_tests: [unique, not_null]
      - name: seller_id
        description: "Mã seller. Fact giữ thêm seller_id dạng degenerate để đếm seller / HHI (BR-CW8-1)."
        data_tests: [not_null]
      - name: version_no
        description: "Số thứ tự phiên bản theo thời gian (1, 2, …)."
      - name: seller_geo_key
        description: "Zip seller → dim_geography (Type 1)."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_geography')
              field: geo_key
      - name: seller_tier
        description: "Hạng seller trong phiên bản (thuộc tính SCD2). Bước 1: 'Not scored'."
        data_tests: [not_null]
      - name: tier_rule_version
        description: "Phiên bản bộ ngưỡng tier (seed seller_tier_rules, bước 2); null ở bước 1."
      - name: valid_from
        description: "Ngày bắt đầu hiệu lực (tính cả ngày này)."
        data_tests: [not_null]
      - name: valid_to
        description: "Ngày cuối hiệu lực (tính cả ngày này); 9999-12-31 cho phiên bản hiện hành."
        data_tests: [not_null]
      - name: is_current
        description: "1 cho phiên bản hiện hành."
        data_tests:
          - accepted_values:
              values: [0, 1]
