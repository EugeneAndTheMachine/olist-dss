version: 2

models:
  - name: dq_issue_summary
    description: >
      Tổng hợp lỗi chất lượng dữ liệu được giữ lại và gắn cờ (không xoá dòng): mỗi dòng là 1 loại lỗi trong 1 model,
      số dòng bị ảnh hưởng và tỷ lệ. Cùng meta.dq_results là nguồn cho trang Data Quality.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [model_name, issue]
    columns:
      - name: layer
        description: "stg / dw"
      - name: model_name
        description: "Model chứa lỗi"
        data_tests: [not_null]
      - name: issue
        description: "Mã lỗi (giá trị _dq_issue hoặc bất thường đã biết)"
        data_tests: [not_null]
      - name: issue_rows
        description: "Số dòng (hoặc điểm / đơn) bị ảnh hưởng"
      - name: total_rows
        description: "Tổng số dòng của model để tính tỷ lệ"
      - name: issue_pct
        description: "issue_rows / total_rows (%)"
      - name: checked_at
        description: "Thời điểm build"
