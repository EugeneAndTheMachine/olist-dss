version: 2

# F6 (02/11): lớp phục vụ Power BI. View mỏng trên dw/meta: đổi tên cột thân thiện, KHÔNG đổi grain,
# không tính KPI (KPI là DAX measure, định nghĩa ở docs/kpi_dictionary.md).
# Quy ước: cột khoá giữ snake_case (*_key, ẩn trong Power BI); cột hiển thị Title Case → phải quote.
# View ML (v_order_late_risk, v_gmv_forecast, …) thêm khi làm nhóm M.
# Giải thích chi tiết: docs/bi_layer.md

models:
  # ---------------------------------------------------------------- dimensions
  - name: v_dim_date
    description: "Bảng Date (1 dòng / ngày 2016–2019, không có dòng -1) — Mark as date table theo cột Date."
    columns:
      - name: date_key
        description: "YYYYMMDD — nối với mọi *_date_key của fact"
        data_tests: [unique, not_null]
      - name: Date
        description: "Ngày"
        quote: true
        data_tests: [unique, not_null]
      - name: Day Name
        description: "Tên thứ"
        quote: true
      - name: Day Of Week No
        description: "1 = thứ Hai … 7 = Chủ nhật (sort cho Day Name)"
        quote: true
      - name: Is Weekend
        description: "Thứ Bảy / Chủ nhật"
        quote: true
      - name: ISO Week
        description: "Tuần ISO"
        quote: true
      - name: Month No
        description: "Tháng 1–12 (sort cho Month Name)"
        quote: true
      - name: Month Name
        description: "Tên tháng"
        quote: true
      - name: Month Short
        description: "Tên tháng 3 ký tự"
        quote: true
      - name: Quarter No
        description: "Quý 1–4"
        quote: true
      - name: Quarter
        description: "Q1–Q4"
        quote: true
      - name: Year
        description: "Năm"
        quote: true
      - name: Year Month
        description: "YYYY-MM (sort bằng Year Month Sort)"
        quote: true
      - name: Year Month Sort
        description: "YYYYMM dạng số"
        quote: true
      - name: Month Start
        description: "Ngày đầu tháng — trục thời gian theo tháng"
        quote: true
      - name: Is BR Holiday
        description: "Ngày lễ quốc gia Brazil"
        quote: true
      - name: Holiday Name
        description: "Tên ngày lễ"
        quote: true
      - name: Is Black Friday Week
        description: "Tuần ISO chứa Black Friday"
        quote: true
      - name: In Analysis Window
        description: "Ngày nằm trong ANALYSIS_START → ANALYSIS_END (mặc định 2017-01-01 → 2018-08-31)"
        quote: true

  - name: v_dim_customer
    description: "Người mua thật (customer_unique_id). Segment ML sẽ nối vào đây ở M4."
    columns:
      - name: customer_key
        description: "Khoá; -1 = unknown"
        data_tests: [unique, not_null]
      - name: Customer Unique ID
        description: "Mã người mua thật"
        quote: true
      - name: first_order_date_key
        description: "Ngày đơn đầu (không tạo relationship, chỉ để tham chiếu)"
      - name: First Order State
        description: "Bang của đơn đầu tiên"
        quote: true
      - name: Lifetime Orders
        description: "Tổng số đơn mọi trạng thái — chỉ để phân loại; KPI Repeat customer rate dùng DAX trên đơn counts_as_sale"
        quote: true
      - name: Customer Type
        description: "One-time / Repeat (≥ 2 đơn mọi trạng thái) / Unknown"
        quote: true

  - name: v_dim_product
    description: "Sản phẩm, hierarchy Category Group → Category → Product."
    columns:
      - name: product_key
        description: "Khoá; -1 = unknown"
        data_tests: [unique, not_null]
      - name: Product ID
        description: "Mã sản phẩm"
        quote: true
      - name: Category (PT)
        description: "Category tiếng Bồ Đào Nha"
        quote: true
      - name: Category
        description: "Category tiếng Anh (thiếu bản dịch → tên PT)"
        quote: true
      - name: Category Group
        description: "Nhóm ngành (~10 nhóm)"
        quote: true
      - name: Photos Qty
        description: "Số ảnh"
        quote: true
      - name: Name Length
        description: "Số ký tự tên"
        quote: true
      - name: Description Length
        description: "Số ký tự mô tả"
        quote: true
      - name: Weight (g)
        description: "Cân nặng"
        quote: true
      - name: Length (cm)
        description: "Dài"
        quote: true
      - name: Height (cm)
        description: "Cao"
        quote: true
      - name: Width (cm)
        description: "Rộng"
        quote: true
      - name: Volume (cm3)
        description: "Thể tích"
        quote: true
      - name: Weight Band
        description: "Dải cân nặng"
        quote: true
      - name: Weight Band Sort
        description: "Thứ tự hiển thị Weight Band"
        quote: true
      - name: Size Band
        description: "Dải thể tích"
        quote: true
      - name: Size Band Sort
        description: "Thứ tự hiển thị Size Band"
        quote: true

  - name: v_dim_seller
    description: >
      Seller SCD2, 1 dòng / version. Fact trỏ version hiệu lực tại thời điểm sự kiện → "Seller Tier" là tier lúc đó.
      "Current Tier" = tier hôm nay của cùng seller; "Previous Tier" = tier version trước (ma trận chuyển tier).
    columns:
      - name: seller_key
        description: "Khoá version; -1 = unknown"
        data_tests: [unique, not_null]
      - name: Seller ID
        description: "Mã seller — đếm seller dùng DISTINCTCOUNT cột này, không đếm dòng"
        quote: true
      - name: Version No
        description: "Thứ tự version"
        quote: true
      - name: Seller Tier
        description: "Tier của version: Gold / Silver / Bronze / New / At-risk / Unscored"
        quote: true
      - name: Seller Tier Sort
        description: "Thứ tự hiển thị tier"
        quote: true
      - name: Previous Tier
        description: "Tier của version liền trước (null ở version 1)"
        quote: true
      - name: Previous Tier Sort
        description: "Thứ tự hiển thị Previous Tier (0 = chưa có version trước)"
        quote: true
      - name: Current Tier
        description: "Tier hiện hành của seller (lặp lại trên mọi version)"
        quote: true
      - name: Current Tier Sort
        description: "Thứ tự hiển thị Current Tier"
        quote: true
      - name: Tier Rule Version
        description: "Phiên bản bộ rule chấm tier"
        quote: true
      - name: Valid From
        description: "Bắt đầu hiệu lực"
        quote: true
      - name: Valid To
        description: "Hết hiệu lực (9999-12-31 = đang hiệu lực)"
        quote: true
      - name: Is Current
        description: "Version hiện hành"
        quote: true
      - name: Has Sales
        description: "Seller đã từng bán"
        quote: true
      - name: Is From Funnel
        description: "Seller đến từ marketing funnel"
        quote: true

  - name: v_dim_customer_geo
    description: "Role-playing geography — địa chỉ giao hàng của khách."
    columns:
      - name: customer_geo_key
        description: "Khoá (= dw.dim_geography.geo_key); -1 = unknown"
        data_tests: [unique, not_null]
      - name: Customer Zip Prefix
        description: "Zip prefix 5 số"
        quote: true
      - name: Customer City
        description: "Thành phố (lower, bỏ dấu)"
        quote: true
      - name: Customer State
        description: "Mã bang 2 ký tự"
        quote: true
      - name: Customer State Name
        description: "Tên bang"
        quote: true
      - name: Customer Region
        description: "Vùng (5 vùng)"
        quote: true
      - name: Customer Latitude
        description: "Vĩ độ tâm zip (Data category = Latitude)"
        quote: true
      - name: Customer Longitude
        description: "Kinh độ tâm zip (Data category = Longitude)"
        quote: true
      - name: Customer State Population
        description: "Dân số bang 2018 — không SUM qua zip; dùng MAX theo bang"
        quote: true

  - name: v_dim_seller_geo
    description: "Role-playing geography — địa chỉ seller."
    columns:
      - name: seller_geo_key
        description: "Khoá (= dw.dim_geography.geo_key); -1 = unknown"
        data_tests: [unique, not_null]
      - name: Seller Zip Prefix
        description: "Zip prefix 5 số"
        quote: true
      - name: Seller City
        description: "Thành phố (lower, bỏ dấu)"
        quote: true
      - name: Seller State
        description: "Mã bang 2 ký tự"
        quote: true
      - name: Seller State Name
        description: "Tên bang"
        quote: true
      - name: Seller Region
        description: "Vùng (5 vùng)"
        quote: true
      - name: Seller Latitude
        description: "Vĩ độ tâm zip"
        quote: true
      - name: Seller Longitude
        description: "Kinh độ tâm zip"
        quote: true
      - name: Seller State Population
        description: "Dân số bang 2018 — không SUM qua zip"
        quote: true

  - name: v_dim_payment_type
    description: "Hình thức thanh toán × dải số kỳ (junk dim)."
    columns:
      - name: payment_type_key
        description: "Khoá; -1 = unknown"
        data_tests: [unique, not_null]
      - name: Payment Type
        description: "credit_card, boleto, voucher, debit_card, not_defined"
        quote: true
      - name: Instalment Band
        description: "1, 2-3, 4-6, 7-10, 11+"
        quote: true
      - name: Instalment Band Sort
        description: "Thứ tự hiển thị"
        quote: true
      - name: Is Instalment
        description: "Trả góp (> 1 kỳ)"
        quote: true

  - name: v_dim_order_status
    description: "Trạng thái đơn. Counts As Sale = true là điều kiện của GMV / Orders."
    columns:
      - name: order_status_key
        description: "Khoá nối với fact"
        data_tests: [unique, not_null]
      - name: Order Status
        description: "Trạng thái gốc"
        quote: true
      - name: Status Group
        description: "Completed / Open / Cancelled / Unknown"
        quote: true
      - name: Counts As Sale
        description: "Đơn tính là bán"
        quote: true

  - name: v_dim_lead_origin
    description: "Kênh marketing + landing page của MQL."
    columns:
      - name: lead_origin_key
        description: "Khoá; -1 = unknown"
        data_tests: [unique, not_null]
      - name: Lead Origin
        description: "organic_search, paid_search, social, … (null gốc → unknown)"
        quote: true
      - name: Landing Page ID
        description: "Landing page"
        quote: true

  - name: v_dim_lead_profile
    description: "Hồ sơ lead — chỉ có cho lead đã chốt; -1 = chưa chốt."
    columns:
      - name: lead_profile_key
        description: "Khoá; -1 = lead chưa chốt"
        data_tests: [unique, not_null]
      - name: Business Segment
        description: "Ngành hàng seller khai"
        quote: true
      - name: Lead Type
        description: "Loại lead"
        quote: true
      - name: Behaviour Profile
        description: "Hồ sơ hành vi DISC"
        quote: true
      - name: Business Type
        description: "reseller / manufacturer / other"
        quote: true
      - name: Has Company
        description: "Có pháp nhân"
        quote: true
      - name: Has GTIN
        description: "Sản phẩm có GTIN"
        quote: true
      - name: Stock Band
        description: "Dải tồn kho khai báo"
        quote: true

  - name: v_dim_sales_rep
    description: "Cặp SDR + SR phụ trách deal."
    columns:
      - name: sales_rep_key
        description: "Khoá; -1 = unknown / lead chưa chốt"
        data_tests: [unique, not_null]
      - name: SDR ID
        description: "Sales development rep"
        quote: true
      - name: SR ID
        description: "Sales rep"
        quote: true

  # ---------------------------------------------------------------- facts
  - name: v_fact_sales
    description: "Bán hàng — 1 dòng / item (dw.fact_order_item). GMV = Σ Item Price với Counts As Sale."
    data_tests:
      - dbt_utils.equal_rowcount:
          compare_model: ref('fact_order_item')
    columns:
      - name: Order ID
        description: "Mã đơn"
        quote: true
      - name: Order Item ID
        description: "Thứ tự item trong đơn"
        quote: true
      - name: purchase_date_key
        description: "→ v_dim_date (relationship active)"
      - name: shipping_limit_date_key
        description: "→ v_dim_date (inactive)"
      - name: customer_key
        description: "→ v_dim_customer"
      - name: product_key
        description: "→ v_dim_product"
      - name: seller_key
        description: "→ v_dim_seller (version tại ngày mua)"
      - name: customer_geo_key
        description: "→ v_dim_customer_geo"
      - name: seller_geo_key
        description: "→ v_dim_seller_geo"
      - name: order_status_key
        description: "→ v_dim_order_status"
      - name: Item Price
        description: "Giá item (BRL)"
        quote: true
      - name: Freight Value
        description: "Phí ship (BRL)"
        quote: true
      - name: Item Total
        description: "Item Price + Freight Value"
        quote: true
      - name: Item Count
        description: "= 1"
        quote: true

  - name: v_fact_fulfillment
    description: "Giao đơn — 1 dòng / đơn (dw.fact_order_fulfillment). Nguồn Orders, AOV, Late rate, lags."
    data_tests:
      - dbt_utils.equal_rowcount:
          compare_model: ref('fact_order_fulfillment')
    columns:
      - name: Order ID
        description: "Mã đơn"
        quote: true
        data_tests: [unique, not_null]
      - name: purchase_date_key
        description: "→ v_dim_date (active)"
      - name: approved_date_key
        description: "→ v_dim_date (inactive)"
      - name: carrier_date_key
        description: "→ v_dim_date (inactive)"
      - name: delivered_date_key
        description: "→ v_dim_date (inactive); -1 = chưa giao"
      - name: estimated_date_key
        description: "→ v_dim_date (inactive)"
      - name: customer_key
        description: "→ v_dim_customer"
      - name: seller_key
        description: "Primary seller (item giá cao nhất) → v_dim_seller"
      - name: customer_geo_key
        description: "→ v_dim_customer_geo"
      - name: seller_geo_key
        description: "→ v_dim_seller_geo"
      - name: order_status_key
        description: "→ v_dim_order_status"
      - name: Item Count
        description: "Số item"
        quote: true
      - name: Order Value
        description: "Σ giá item, không gồm ship (BRL)"
        quote: true
      - name: Freight Total
        description: "Σ phí ship (BRL)"
        quote: true
      - name: Is Delivered
        description: "0/1 — mẫu số của Late rate"
        quote: true
      - name: Is Late
        description: "0/1 — giao sau ngày hứa"
        quote: true
      - name: Is Dispatch Late
        description: "0/1 — giao hãng vận chuyển sau shipping limit"
        quote: true
      - name: Has Carrier Date
        description: "0/1 — mẫu số của Dispatch late rate"
        quote: true
      - name: Approval Lag (days)
        description: "approved − purchase"
        quote: true
      - name: Dispatch Lag (days)
        description: "carrier − approved (null nếu âm)"
        quote: true
      - name: Transit Lag (days)
        description: "delivered − carrier (null nếu âm)"
        quote: true
      - name: Delivery Lag (days)
        description: "delivered − purchase, chỉ đơn đã giao"
        quote: true
      - name: Promised Lag (days)
        description: "estimated − purchase"
        quote: true
      - name: Delay Days
        description: "delivered − estimated theo ngày (âm = sớm), chỉ đơn đã giao"
        quote: true
      - name: Distance (km)
        description: "Haversine seller ↔ khách — non-additive, dùng AVERAGE"
        quote: true
      - name: DQ Issue
        description: "Mã lỗi mốc thời gian (null = sạch)"
        quote: true

  - name: v_fact_review
    description: "Review — 1 dòng / (review, đơn). KPI chỉ dùng Is Latest For Order = true."
    data_tests:
      - dbt_utils.equal_rowcount:
          compare_model: ref('fact_review')
    columns:
      - name: Review ID
        description: "Mã review"
        quote: true
      - name: Order ID
        description: "Mã đơn"
        quote: true
      - name: review_creation_date_key
        description: "→ v_dim_date (active)"
      - name: review_answer_date_key
        description: "→ v_dim_date (inactive)"
      - name: customer_key
        description: "→ v_dim_customer"
      - name: seller_key
        description: "Primary seller → v_dim_seller"
      - name: customer_geo_key
        description: "→ v_dim_customer_geo"
      - name: order_status_key
        description: "→ v_dim_order_status"
      - name: Review Count
        description: "= 1"
        quote: true
      - name: Review Score
        description: "1–5 — không SUM"
        quote: true
      - name: Score Sum
        description: "= Review Score, để cộng"
        quote: true
      - name: Is Low Score
        description: "0/1 — điểm ≤ 2"
        quote: true
      - name: Has Comment
        description: "0/1"
        quote: true
      - name: Comment Length
        description: "Số ký tự bình luận"
        quote: true
      - name: Response Hours
        description: "Giờ từ lúc gửi khảo sát tới lúc trả lời"
        quote: true
      - name: Is Latest For Order
        description: "Review dùng cho KPI của đơn"
        quote: true

  - name: v_fact_payment
    description: "Thanh toán — 1 dòng / lần thanh toán."
    data_tests:
      - dbt_utils.equal_rowcount:
          compare_model: ref('fact_payment')
    columns:
      - name: Order ID
        description: "Mã đơn"
        quote: true
      - name: Payment Sequential
        description: "Thứ tự lần thanh toán"
        quote: true
      - name: purchase_date_key
        description: "→ v_dim_date (active)"
      - name: customer_key
        description: "→ v_dim_customer"
      - name: payment_type_key
        description: "→ v_dim_payment_type"
      - name: order_status_key
        description: "→ v_dim_order_status"
      - name: Payment Value
        description: "Số tiền (BRL)"
        quote: true
      - name: Payment Count
        description: "= 1"
        quote: true
      - name: Installments
        description: "Số kỳ — non-additive, dùng AVERAGE"
        quote: true

  - name: v_fact_seller_month
    description: "Seller × tháng (periodic snapshot). Is Active semi-additive; Distinct Customers non-additive."
    data_tests:
      - dbt_utils.equal_rowcount:
          compare_model: ref('fact_seller_month')
    columns:
      - name: month_date_key
        description: "Ngày đầu tháng → v_dim_date (active)"
      - name: seller_key
        description: "Version hiệu lực cuối tháng → v_dim_seller"
      - name: seller_geo_key
        description: "→ v_dim_seller_geo"
      - name: Orders
        description: "Đơn counts_as_sale"
        quote: true
      - name: Items
        description: "Item bán"
        quote: true
      - name: GMV
        description: "Σ item_price đơn counts_as_sale"
        quote: true
      - name: Delivered Orders
        description: "Đơn đã giao"
        quote: true
      - name: Late Orders
        description: "Đơn trễ"
        quote: true
      - name: Cancelled Orders
        description: "Đơn huỷ"
        quote: true
      - name: Review Count
        description: "Số review"
        quote: true
      - name: Score Sum
        description: "Tổng điểm review"
        quote: true
      - name: Is Active
        description: "0/1 — có ≥ 1 đơn trong tháng"
        quote: true
      - name: Distinct Customers
        description: "Số khách khác nhau trong tháng — không SUM"
        quote: true

  - name: v_fact_lead_funnel
    description: "Funnel MQL → won → first sale, 1 dòng / MQL."
    data_tests:
      - dbt_utils.equal_rowcount:
          compare_model: ref('fact_lead_funnel')
    columns:
      - name: MQL ID
        description: "Mã lead"
        quote: true
        data_tests: [unique, not_null]
      - name: first_contact_date_key
        description: "→ v_dim_date (active)"
      - name: won_date_key
        description: "→ v_dim_date (inactive); -1 = chưa chốt"
      - name: first_sale_date_key
        description: "→ v_dim_date (inactive); -1 = chưa bán"
      - name: lead_origin_key
        description: "→ v_dim_lead_origin"
      - name: lead_profile_key
        description: "→ v_dim_lead_profile"
      - name: sales_rep_key
        description: "→ v_dim_sales_rep"
      - name: seller_key
        description: "→ v_dim_seller (version tại ngày chốt)"
      - name: Lead Count
        description: "= 1"
        quote: true
      - name: Is Won
        description: "0/1"
        quote: true
      - name: Has First Sale
        description: "0/1"
        quote: true
      - name: Days To Close
        description: "won − first contact (ngày)"
        quote: true
      - name: Declared Catalog Size
        description: "Seller tự khai — độ tin thấp"
        quote: true
      - name: Declared Monthly Revenue
        description: "Seller tự khai — độ tin thấp"
        quote: true
      - name: GMV First 90 Days
        description: "Σ item_price 90 ngày đầu sau khi chốt"
        quote: true
      - name: Has Full 90d Window
        description: "0/1 — chỉ so GMV 90 ngày trên lead = 1"
        quote: true
      - name: DQ Issue
        description: "won_before_contact nếu chốt trước liên hệ"
        quote: true

  - name: v_fact_seller_product_activity
    description: "Factless — seller × product × tháng. Đếm dòng = số listing hoạt động."
    data_tests:
      - dbt_utils.equal_rowcount:
          compare_model: ref('fact_seller_product_activity')
    columns:
      - name: month_date_key
        description: "→ v_dim_date (active)"
      - name: seller_key
        description: "→ v_dim_seller"
      - name: product_key
        description: "→ v_dim_product"

  # ---------------------------------------------------------------- data quality (trang 8)
  - name: v_dq_latest
    description: "Kết quả test dbt của lần chạy gần nhất đã publish vào meta.dq_results."
    columns:
      - name: Run ID
        description: "invocation_id của dbt"
        quote: true
      - name: Test Name
        description: "Tên test"
        quote: true
      - name: Test Type
        description: "generic / singular"
        quote: true
      - name: Model
        description: "Model được test"
        quote: true
      - name: Layer
        description: "stg / dw / bi / other (suy từ tên model)"
        quote: true
      - name: Status
        description: "pass / warn / fail / error"
        quote: true
      - name: Is Pass
        description: "0/1"
        quote: true
      - name: Failures
