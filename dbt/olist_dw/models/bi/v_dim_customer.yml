version: 2

models:
  - name: v_dim_customer
    description: "Power BI: dim_customer (1 dòng / customer_unique_id + -1). Nối v_fact_*[customer_key]."
    columns:
      - name: customer_key
        description: "Khoá nối với fact."
        data_tests: [unique, not_null]
      - name: customer_geo_key
        description: "Zip của đơn đầu tiên. Phân tích theo khu vực của đơn dùng customer_geo_key của fact, không dùng cột này."
