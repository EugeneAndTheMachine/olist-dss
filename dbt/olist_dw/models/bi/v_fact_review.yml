    description: "Power BI: fact_review. Measure review lọc is_latest_for_order = 1 (BR-K3)."
    columns:
      - name: review_creation_date_key
        description: "Nối v_dim_date."
      - name: primary_seller_key
        description: "Nối v_dim_seller."
