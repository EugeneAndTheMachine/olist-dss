name: olist_dw
version: "0.1.0"
config-version: 2
profile: olist_dw

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
target-path: "target"
# Airflow (Docker trên Windows) cài package vào thư mục trong container: giải nén lên bind mount NTFS bị thiếu file
packages-install-path: "{{ env_var('DBT_PACKAGES_INSTALL_PATH', 'dbt_packages') }}"
clean-targets: ["target", "dbt_packages"]

vars:
  analysis_start: "{{ env_var('ANALYSIS_START', '2017-01-01') }}"
  analysis_end: "{{ env_var('ANALYSIS_END', '2018-08-31') }}"
  # Biến nghiệp vụ (date spine, SCD2, rule version…) thêm khi chốt nghiệp vụ: docs/rebuild_guide.md

# Power BI đăng nhập bằng user chỉ đọc schema bi (macros/grant_bi_reader.sql)
on-run-end:
  - "{{ grant_bi_reader() }}"

# Schema đích lấy đúng tên (stg, dw, bi) nhờ macro generate_schema_name
models:
  olist_dw:
    +persist_docs:
      relation: true
      columns: true
    # Bảng vừa tạo chưa có statistics → planner chọn join tệ (fact_order_fulfillment > 10 phút thay vì < 1 giây)
    +post-hook:
      - "{% if config.get('materialized') in ('table', 'incremental') %}analyze {{ this }}{% endif %}"
    staging:
      +schema: stg
      +materialized: table
    intermediate:
      +schema: stg
      +materialized: table
    warehouse:
      +schema: dw
      +materialized: table
    bi:
      +schema: bi
      +materialized: view

seeds:
  olist_dw:
    +schema: stg
    +persist_docs:
      relation: true
      columns: true

snapshots:
  olist_dw:
    +target_schema: stg
