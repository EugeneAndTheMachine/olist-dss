[project]
name = "olist-dss"
version = "0.1.0"
description = "Olist Data Warehouse & Decision Support — ingestion, dbt, ML"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Ingestion
    "pandas>=2.1,<3",
    "pyarrow>=14",
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "azure-storage-blob>=12.20",
    "kaggle>=1.6",
    "requests>=2.31",
    "holidays>=0.50",
    "unidecode>=1.3",
    # dbt — cùng minor version với image Airflow (docker/airflow/Dockerfile)
    "dbt-core~=1.9.0",
    "dbt-postgres~=1.9.0",
    # ML & decision support
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "statsmodels>=0.14",
    "pulp>=2.8",
    "shap>=0.45",
]

[dependency-groups]
# Notebook / EDA (uv sync cài mặc định)
dev = [
    "jupyter",
    "matplotlib",
    "seaborn",
]

[tool.uv]
# Repo ứng dụng, không build thành package
package = false
# shap → numba → llvmlite: chặn resolver chọn bản cũ không hỗ trợ Python 3.11
constraint-dependencies = ["numba>=0.60", "llvmlite>=0.43"]
