name: olist-dss

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    # Mặc định Docker cấp /dev/shm 64 MB → join song song khi build fact lỗi "could not resize shared memory segment"
    shm_size: 512mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-olist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olist}
      POSTGRES_DB: ${POSTGRES_DB:-olist_dw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Chỉ chạy lần đầu khi volume pgdata còn trống
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-olist} -d ${POSTGRES_DB:-olist_dw}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Data lake: Azurite = giả lập Azure Blob Storage của Microsoft (thay MinIO, đã ngừng phát hành image).
  # Dùng Azure thật: đổi AZURE_STORAGE_CONNECTION_STRING trong .env, không cần service này.
  azurite:
    image: ${AZURITE_IMAGE:-mcr.microsoft.com/azure-storage/azurite:3.37.0}
    restart: unless-stopped
    command: >
      azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data
      --loose --skipApiVersionCheck
    ports:
      - "10000:10000"
    volumes:
      - azuritedata:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Chỉ bật khi cần: make up-airflow (docker compose --profile airflow up -d)
  airflow:
    profiles: ["airflow"]
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    image: olist-airflow:local
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # Ghi đè giá trị localhost trong .env bằng tên service trong mạng docker
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # Connection string Azurite trỏ 127.0.0.1:10000 → trong container đổi thành host "azurite" (ingestion/lake.py)
      AZURITE_HOST: azurite
      OLIST_HOME: /opt/olist
      PYTHONPATH: /opt/olist
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/olist/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-olist}:${POSTGRES_PASSWORD:-olist}@postgres:5432/${AIRFLOW_DB:-airflow}
    command: >
      bash -c "
      airflow db migrate &&
      (airflow users create --username $${AIRFLOW_ADMIN_USER:-admin} --password $${AIRFLOW_ADMIN_PASSWORD:-admin} --firstname Olist --lastname Admin --role Admin --email admin@example.com || true) &&
      exec airflow standalone
      "
    ports:
      - "8080:8080"
    volumes:
      # Mount cả repo: DAG, ingestion, dbt, ml, scripts, data dùng chung với máy host
      - .:/opt/olist

volumes:
  pgdata:
  azuritedata:
